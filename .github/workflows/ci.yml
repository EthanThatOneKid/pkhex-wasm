name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Release build
        run: dotnet build pkhex-wasm.slnx -c Release

      - name: Full test suite (logic seam)
        run: dotnet test pkhex-wasm.slnx -c Release --no-build --nologo

      - name: Generator drift gate
        run: deno task gen:check

      - name: Generator tests
        run: deno task apigen:test

      - name: Typecheck TS sources
        run: deno task typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate fixtures, publish site, bundle harness
        working-directory: tests/e2e
        run: |
          npm ci
          npm run prepare:e2e

      - name: Install headless Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: tests/e2e
        run: npx playwright test

      # Intermittent e2e reds have served a bad dotnet.js; ship the actual
      # served runtime so the failing bytes can be inspected post-mortem.
      - name: Upload served wasm runtime for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-site-framework
          path: artifacts/e2e-site/wwwroot/_framework
          retention-days: 7
          if-no-files-found: ignore

      - name: Package + size budget gate (8 MB gz first-load)
        run: |
          npm ci --prefix tools/package
          node tools/package/build-package.mjs --version 0.0.0-ci

      - name: Verify packaged artifact boots in Chromium
        working-directory: tests/e2e
        run: node verify-package.mjs

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-dist
          path: |
            artifacts/pkg-dist/*.tgz
            artifacts/pkg-dist/complete-source.tar.gz
          if-no-files-found: error

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
